name: release/github

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching package.json, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Normalize and validate requested tag
        id: release_tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          normalized="$(printf '%s' "$REQUESTED_TAG" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          if [ "$normalized" != "$expected" ]; then
            echo "Requested tag must equal $expected" >&2
            exit 1
          fi
          if git rev-parse "$normalized" >/dev/null 2>&1; then
            echo "Tag already exists: $normalized" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$normalized" >> "$GITHUB_OUTPUT"

      - name: Require successful protected CI and CodeQL for exact main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Main moved after release dispatch; refusing stale release" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&branch=main&per_page=100" > "$RUNNER_TEMP/release-prerequisite-runs.json"
          node scripts/verify-release-prerequisites.mjs "$RUNNER_TEMP/release-prerequisite-runs.json" "$GITHUB_SHA" release-prerequisites.json

      - name: Verify maintained release candidate
        run: make verify-fresh

      - name: Verify container path
        run: |
          docker compose config --quiet
          docker compose up --build --abort-on-container-exit --exit-code-from verify

      - name: Build release evidence bundle
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/create-release-manifest.mjs "${{ steps.release_tag.outputs.tag }}" "$GITHUB_SHA" release-manifest.json
          npm sbom --sbom-format=cyclonedx > sbom.cdx.json
          python -m pip list --format=json > python-dependencies.json
          printf '%s\n' "$GITHUB_SHA" > release-commit.txt
          sha256sum sbom.cdx.json python-dependencies.json release-commit.txt release-manifest.json release-prerequisites.json > release-artifacts.sha256

      - name: Verify release evidence checksums
        run: sha256sum --check release-artifacts.sha256

      - name: Retain release evidence before publication
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ steps.release_tag.outputs.tag }}
          if-no-files-found: error
          retention-days: 30
          path: |
            sbom.cdx.json
            python-dependencies.json
            release-commit.txt
            release-manifest.json
            release-artifacts.sha256
            release-prerequisites.json


      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release_tag.outputs.tag }}" \
            sbom.cdx.json python-dependencies.json release-commit.txt release-artifacts.sha256 release-manifest.json release-prerequisites.json \
            --target "$GITHUB_SHA" \
            --title "${{ steps.release_tag.outputs.tag }}" \
            --generate-notes
