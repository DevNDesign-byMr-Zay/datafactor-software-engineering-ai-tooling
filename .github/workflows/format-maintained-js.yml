name: Format maintained JavaScript

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/format-maintained-js.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install pinned tooling
        run: npm ci --ignore-scripts
      - name: Format maintained files
        run: >-
          npx prettier --write
          tests/js
          'Software Engineering & AI Tooling/Frontend Engineering/JavaScript/Aster JavaScript v638.js'
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/js "Software Engineering & AI Tooling/Frontend Engineering/JavaScript/Aster JavaScript v638.js"
          if git diff --cached --quiet; then
            echo "Maintained JavaScript is already formatted."
            exit 0
          fi
          git commit -m "style: format maintained JavaScript [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
