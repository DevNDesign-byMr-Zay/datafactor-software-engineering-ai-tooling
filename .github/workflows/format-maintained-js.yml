name: Verify maintained JavaScript formatting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned tooling
        run: npm ci --ignore-scripts
      - name: Verify maintained files are formatted
        run: >-
          npx prettier --check
          src
          tests/js
          'Software Engineering & AI Tooling/Frontend Engineering/JavaScript/Aster JavaScript v638.js'
