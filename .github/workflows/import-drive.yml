# Importer revision: transactional-pr-v1
name: Refresh archived Drive corpus

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: drive-code-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out immutable archive baseline
        uses: actions/checkout@v7
        with:
          ref: archive/historical-corpus-v1.2.2
          fetch-depth: 0

      - name: Install Drive importer dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "gdown==6.1.0"

      - name: Import complete code corpus transactionally
        run: python3 .github/scripts/import_drive.py

      - name: Verify fresh-clone maintained surface
        run: make verify-fresh

      - name: Publish reviewed corpus refresh
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/archive-corpus-refresh"

          git add -- "Software Engineering & AI Tooling" IMPORT_REPORT.md IMPORT_FAILURES.json
          if git diff --cached --quiet; then
            echo "Drive corpus already matches the repository."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -m "chore: refresh mirrored code corpus"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
          fi
          git push --force-with-lease origin HEAD:"$branch"

          pr_number="$(gh pr list --head "$branch" --base archive/historical-corpus-v1.2.2 --state open --json number --jq '.[0].number // empty')"
          body="Automated corpus refresh completed only after every selected source/configuration file downloaded successfully. The importer is transactional, so blocked downloads leave the current corpus untouched. Fresh-clone maintained checks passed before this branch was published. This refresh targets the archive branch only and must never repopulate maintained main."

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "Review archived corpus refresh" --body "$body"
          else
            gh pr create --base archive/historical-corpus-v1.2.2 --head "$branch" --title "Review complete corpus refresh" --body "$body"
          fi
