name: One-time Python hashed lock generation

on:
  push:
    branches:
      - fix/python-hash-verified-install-20261102

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/fix/python-hash-verified-install-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate hash-pinned requirements from existing exact versions
        shell: bash
        run: |
          set -euo pipefail
          if [ -f requirements.hashed.txt ]; then
            echo "Already generated; no regeneration"
            exit 0
          fi
          python -m pip install --disable-pip-version-check uv==0.10.0
          uv pip compile --no-deps --generate-hashes --python-version 3.12 \
            requirements.lock.txt --output-file requirements.hashed.txt
          test -s requirements.hashed.txt
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.hashed.txt
          python -m pip check
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.hashed.txt
          git commit -m 'build(python): record actual artifact SHA-256 hashes for locked dependencies'
          git push origin HEAD:fix/python-hash-verified-install-20261102
