name: Temporary lockfile refresh (PR 237 only)

on:
  push:
    branches:
      - fix/isolated-checkout-offline-verification-20261031

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/fix/isolated-checkout-offline-verification-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Generate package-lock from verified package metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Save computed lockfile to this source branch only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain -- package-lock.json)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "build(deps): lock patched transitive test tooling versions"
          git push origin HEAD:fix/isolated-checkout-offline-verification-20261031
