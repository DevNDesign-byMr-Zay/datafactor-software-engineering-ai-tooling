name: ÆtherForge Codespaces Configuration
on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'apps/aetherforge-workbench/server.mjs'
      - '.github/workflows/aetherforge-codespaces.yml'
  push:
    branches: [feat/aetherforge-workbench-ui]
    paths:
      - '.devcontainer/**'
      - 'apps/aetherforge-workbench/server.mjs'
      - '.github/workflows/aetherforge-codespaces.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codespaces-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate configuration and protected startup policy
        run: |
          bash -n .devcontainer/start-aetherforge.sh
          node --check .devcontainer/check-environment.mjs
          node --check .devcontainer/backup-commercial.mjs
          node --check .devcontainer/verify-execution.mjs
          bash -n .devcontainer/start-commercial.sh
          python3 -m py_compile tools/import-aetherforge-commercial.py
          node --check apps/aetherforge-workbench/server.mjs
          bash -n .devcontainer/start-all.sh
          node --test .devcontainer/backup-commercial.test.mjs .devcontainer/start-all.test.mjs .devcontainer/codespaces.test.mjs .devcontainer/check-environment.test.mjs apps/aetherforge-workbench/sandbox-runtime-policy.test.mjs apps/aetherforge-workbench/minimus-sandbox-policy.test.mjs
