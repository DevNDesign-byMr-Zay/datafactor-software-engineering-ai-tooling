name: One-time verified v1.2.5 release dispatch

on:
  push:
    branches:
      - ops/dispatch-v1.2.5-verified-20261102

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch validated main release
    if: github.repository == 'DevNDesign-byMr-Zay/datafactor-software-engineering-ai-tooling'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact main commit and completed protected verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 20927da1006f8a635a771a815421095169dede14
          RELEASE_TAG: v1.2.5
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          current="$(gh api "repos/$repo/commits/main" --jq .sha)"
          test "$current" = "$EXPECTED_SHA" || { echo "::error::Main moved since verification"; exit 1; }
          version="$(gh api "repos/$repo/contents/package.json?ref=main" --jq .content | base64 --decode | jq -r '.version')"
          test "$version" = "1.2.5" || { echo "::error::Unexpected release version"; exit 1; }
          if gh release view "$RELEASE_TAG" --repo "$repo" >/dev/null 2>&1; then
            echo "::error::Release exists: refusing to republish"
            exit 1
          fi
          runs="$(gh api "repos/$repo/actions/runs?head_sha=$EXPECTED_SHA&branch=main&per_page=100")"
          for workflow in 'engineering/ci' 'security/codeql' 'Refresh dependency lockfiles'; do
            jq -e --arg sha "$EXPECTED_SHA" --arg workflow "$workflow" '
              [.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .name == $workflow)] |
              sort_by(.id) | last |
              .status == "completed" and .conclusion == "success"
            ' <<<"$runs" >/dev/null || { echo "::error::Protected workflow not green: $workflow"; exit 1; }
          done
          gh api --method POST "repos/$repo/actions/workflows/release.yml/dispatches" \
            -f ref=main -f inputs[tag]="$RELEASE_TAG"
          echo "Requested existing gated release/github workflow for $RELEASE_TAG at $EXPECTED_SHA"
