name: ÆTHERFORGE Commercial Tagged Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/aetherforge-commercial-v1.5.0-cloud-release-approved'

permissions:
  contents: write

concurrency:
  group: aetherforge-commercial-release
  cancel-in-progress: false

jobs:
  release-commercial:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published release or authorize initial publication
        id: release_guard
        env:
          RELEASE_TAG: aetherforge-commercial-v1.5.0-cloud
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(node -p "require('./package.json').version")" = '1.2.3'
          git fetch --tags
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            echo "$existing" | jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false' >/dev/null
            for name in \
              AETHERFORGE-Commercial-v1.5.0-cloud.zip \
              AETHERFORGE-Commercial-v1.5.0-cloud.sha256 \
              RELEASE-NOTES.md RELEASE-COMMIT.txt RELEASE-METADATA.sha256; do
              echo "$existing" | jq -e --arg name "$name" '[.assets[] | select(.name == $name and .size > 0)] | length == 1' >/dev/null || {
                echo "Published release is incomplete: $name" >&2
                exit 1
              }
            done
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Existing published release verified (5 nonempty assets); no retag, rebuild, or overwrite." >> "$GITHUB_STEP_SUMMARY"
          elif git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag exists but published release is missing or inaccessible. Refusing to overwrite." >&2
            exit 1
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Tag is absent. Run protected packaging, smoke tests and publication." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Test packaging and commercial source contracts
        if: steps.release_guard.outputs.publish == 'true'
        run: |
          set -euo pipefail
          node --check tools/package-aetherforge-commercial.mjs
          node --test tools/package-aetherforge-commercial.test.mjs tests/aetherforge-commercial-cloud.test.mjs tests/aetherforge-cloud-ui-regression.test.mjs tests/aetherforge-ide-stabilization.test.mjs tests/aetherforge-workspace-persistence.test.mjs tests/aetherforge-preview-policy.test.mjs
      - name: Build distributable ZIP and verify its extracted runtime
        if: steps.release_guard.outputs.publish == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aetherforge-commercial-dist"
          node tools/package-aetherforge-commercial.mjs --output "$RUNNER_TEMP/aetherforge-commercial-dist/bundle"
          cd "$RUNNER_TEMP/aetherforge-commercial-dist"
          zip -q -r -X AETHERFORGE-Commercial-v1.5.0-cloud.zip bundle
          unzip -t AETHERFORGE-Commercial-v1.5.0-cloud.zip | tail -n 2
          (
            cd bundle
            AETHERFORGE_PORT=4546 node apps/aetherforge-commercial/server.mjs > /tmp/aetherforge-release-smoke.log 2>&1 &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true' EXIT
            for i in $(seq 1 25); do
              if curl -fsS http://127.0.0.1:4546/api/health > /tmp/aetherforge-release-health.json; then break; fi
              sleep 1
            done
            node --input-type=module -e "import{readFileSync}from'node:fs';let v=JSON.parse(readFileSync('/tmp/aetherforge-release-health.json'));if(v.version!=='1.5.0-cloud'||!v.projectPersistence)process.exit(1)"
          )
          sha256sum AETHERFORGE-Commercial-v1.5.0-cloud.zip > AETHERFORGE-Commercial-v1.5.0-cloud.sha256
          sha256sum --check AETHERFORGE-Commercial-v1.5.0-cloud.sha256
          cp "$GITHUB_WORKSPACE/docs/AETHERFORGE-RELEASE-NOTES-v1.5.0-cloud.md" ./RELEASE-NOTES.md
          printf '%s\n' "$GITHUB_SHA" > RELEASE-COMMIT.txt
          sha256sum RELEASE-NOTES.md RELEASE-COMMIT.txt > RELEASE-METADATA.sha256
          mkdir -p "$GITHUB_WORKSPACE/release-upload"
          cp AETHERFORGE-Commercial-v1.5.0-cloud.zip AETHERFORGE-Commercial-v1.5.0-cloud.sha256 RELEASE-NOTES.md RELEASE-COMMIT.txt RELEASE-METADATA.sha256 "$GITHUB_WORKSPACE/release-upload/"
      - name: Retain verified artifact
        if: steps.release_guard.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: aetherforge-commercial-v1.5.0-cloud
          path: release-upload/
          if-no-files-found: error
      - name: Publish namespaced GitHub Release
        if: steps.release_guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create aetherforge-commercial-v1.5.0-cloud \
            release-upload/AETHERFORGE-Commercial-v1.5.0-cloud.zip \
            release-upload/AETHERFORGE-Commercial-v1.5.0-cloud.sha256 \
            release-upload/RELEASE-NOTES.md \
            release-upload/RELEASE-COMMIT.txt \
            release-upload/RELEASE-METADATA.sha256 \
            --target "$GITHUB_SHA" \
            --title "ÆTHERFORGE Commercial v1.5.0-cloud" \
            --notes-file docs/AETHERFORGE-RELEASE-NOTES-v1.5.0-cloud.md
