name: engineering/ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Reproducible npm install
        run: npm ci --ignore-scripts
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=moderate
      - name: Verify maintained/historical surface manifest
        run: npm run verify:surface
      - name: Verify release-readiness contract
        run: npm run verify:release
      - name: Smoke-test release manifest generation
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v$(node -p "require('./package.json').version")"
          node scripts/create-release-manifest.mjs "$release_tag" "$GITHUB_SHA" "$RUNNER_TEMP/release-manifest.json"
          test -s "$RUNNER_TEMP/release-manifest.json"

      - name: Type-check maintained JavaScript
        run: npm run typecheck
      - name: Lint maintained JavaScript
        run: npm run lint
      - name: Check maintained JavaScript formatting
        shell: bash
        run: |
          set +e
          npm run format:check
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            npm run format >/dev/null
            echo "::group::Required Prettier changes"
            git --no-pager diff -- src tests/js scripts "Software Engineering & AI Tooling/Frontend Engineering/JavaScript/Aster JavaScript v638.js"
            echo "::endgroup::"
            exit "$status"
          fi
      - name: Run conventional JavaScript test suite
        run: npm test
      - name: Run JavaScript tests with enforced coverage
        run: npm run test:coverage
      - name: Retain JavaScript coverage evidence
        uses: actions/upload-artifact@v7
        with:
          name: javascript-coverage-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: coverage/
      - name: Run sustainability evidence demo
        run: npm run demo:sustainability

  python:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Reproducible Python install
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Verify installed dependency graph
        run: python -m pip check
      - name: Verify Python declaration/lock parity
        run: python scripts/verify_python_lock.py
      - name: Audit Python dependencies
        run: pip-audit -r requirements.lock.txt
      - name: Compile corpus maintenance scripts
        run: python -m py_compile .github/scripts/import_drive.py .github/scripts/verify_drive.py
      - name: Lint maintained Python
        run: python -m ruff check .
      - name: Run Python tests with enforced coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report --include="python_support/*.py,Software Engineering & AI Tooling/Backend Engineering/Python/Aster Python v002.py" --fail-under=85
          python -m coverage xml -o python-coverage.xml
      - name: Retain Python coverage evidence
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: python-coverage.xml

  container:
    name: Container verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate canonical Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build and run maintained checks in container
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSE_FILE=docker-compose.yml
          trap 'docker compose down --volumes --remove-orphans' EXIT
          docker compose up --build --abort-on-container-exit --exit-code-from verify
