name: engineering/ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Reproducible npm install
        run: npm ci --ignore-scripts
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high
      - name: Lint maintained JavaScript
        run: npm run lint
      - name: Check maintained JavaScript formatting
        run: npm run format:check
      - name: Run JavaScript tests with enforced coverage
        run: npm run test:coverage

  python:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Reproducible Python install
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Verify installed dependency graph
        run: python -m pip check
      - name: Audit Python dependencies
        run: pip-audit -r requirements.lock.txt
      - name: Lint maintained Python
        run: python -m ruff check .
      - name: Run Python tests with enforced coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report --include="Software Engineering & AI Tooling/Backend Engineering/Python/Aster Python v002.py" --fail-under=85
