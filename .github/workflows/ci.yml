name: engineering/ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Reproducible npm install
        run: npm ci --ignore-scripts
      - name: Record installed Node production dependency inventory
        run: npm ls --omit=dev --depth=0 --json > node-runtime-dependencies.json
      - name: dependency-audit
        run: npm audit --audit-level=moderate
      - name: Verify maintained/historical surface manifest
        run: npm run verify:surface
      - name: Verify release-readiness contract
        run: npm run verify:release
      - name: Verify generated Evidence Center remains synchronized
        run: npm run verify:evidence-center
      - name: Smoke-test release manifest generation
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v$(node -p "require('./package.json').version")"
          node scripts/create-release-manifest.mjs "$release_tag" "$GITHUB_SHA" "$RUNNER_TEMP/release-manifest.json"
          test -s "$RUNNER_TEMP/release-manifest.json"

      - name: ci_runs_typecheck (Type-check maintained JavaScript)
        run: npm run typecheck
      - name: Strictly type-check critical public JavaScript APIs
        run: npm run typecheck:strict
      - name: ci_runs_lint (Lint maintained JavaScript)
        run: npm run lint
      - name: Check maintained JavaScript formatting
        shell: bash
        run: |
          set +e
          npm run format:check
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            npm run format >/dev/null
            echo "::group::Required Prettier changes"
            git --no-pager diff -- src tests/js scripts
            echo "::endgroup::"
            exit "$status"
          fi
      - name: ci_runs_tests (root-node-test)
        run: npm test
      - name: ci_runs_coverage (root-node-coverage)
        run: npm run test:coverage
      - name: Retain JavaScript coverage evidence
        uses: actions/upload-artifact@v7
        with:
          name: javascript-coverage-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: coverage/
      - name: Retain installed Node production dependencies
        uses: actions/upload-artifact@v7
        with:
          name: node-production-dependencies-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: node-runtime-dependencies.json
      - name: Run sustainability evidence demo
        run: npm run demo:sustainability

  python:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Reproducible Python install
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify installed dependency graph
        run: python -m pip check
      - name: Record installed Python dependency inventories
        run: |
          python -m pip list --format=json > python-installed-dependencies.json
          python -m pip list --not-required --format=json > python-top-level-dependencies.json
      - name: Verify Python declaration/lock parity
        run: python scripts/verify_python_lock.py
      - name: Audit Python dependencies
        run: pip-audit -r requirements.lock.txt
      - name: Compile corpus maintenance scripts
        run: python -m py_compile .github/scripts/import_drive.py .github/scripts/verify_drive.py
      - name: Lint maintained Python
        run: python -m ruff check .
      - name: python-test
        run: python -m pytest
      - name: python-coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report --include="python_support/*.py" --fail-under=85
          python -m coverage xml -o python-coverage.xml
      - name: Retain Python coverage evidence
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: python-coverage.xml
      - name: Retain installed Python dependencies
        uses: actions/upload-artifact@v7
        with:
          name: python-installed-dependencies-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            python-installed-dependencies.json
            python-top-level-dependencies.json

  fresh-clone-smoke:
    name: fresh-clone-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository without cache
        uses: actions/checkout@v7
      - name: Set up Node.js without cache
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Set up Python without cache
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run fresh clone verification suite
        run: make verify-fresh

  container:
    name: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate canonical Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build and run maintained checks in container
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSE_FILE=docker-compose.yml
          trap 'docker compose down --volumes --remove-orphans' EXIT
          docker compose up --build --abort-on-container-exit --exit-code-from verify
      - name: Prove maintained verification runs with no network
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag maintained-offline-check .
          docker run --rm --network none maintained-offline-check make verify-offline

  engineering-evidence:
    name: Engineering verification evidence
    needs: [javascript, python, fresh-clone-smoke, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Generate machine-readable verification contract
        run: node scripts/build-engineering-evidence.mjs --output engineering-evidence.json
      - name: Capture actual successful prerequisite job conclusions
        shell: bash
        env:
          CI_VERIFIED_NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$CI_VERIFIED_NEEDS" > "$RUNNER_TEMP/ci-verified-needs.json"
          node scripts/build-ci-gate-receipt.mjs \
            --input "$RUNNER_TEMP/ci-verified-needs.json" \
            --output ci-gate-results.json \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"
      - name: Upload commit-linked engineering verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: engineering-evidence-${{ github.sha }}
          path: |
            engineering-evidence.json
            ci-gate-results.json
          if-no-files-found: error
          retention-days: 30
