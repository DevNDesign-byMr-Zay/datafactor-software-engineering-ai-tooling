name: ÆtherForge Commercial Cloud CI
on:
  pull_request:
    paths:
      - 'apps/aetherforge-commercial/**'
      - 'tests/aetherforge-commercial-cloud.test.mjs'
      - '.github/workflows/aetherforge-commercial-cloud.yml'
  push:
    branches: [feat/aetherforge-workbench-ui]
    paths:
      - 'apps/aetherforge-commercial/**'
      - 'tests/aetherforge-commercial-cloud.test.mjs'
      - '.github/workflows/aetherforge-commercial-cloud.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commercial-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate cloud service syntax and browser assets
        run: |
          node --check apps/aetherforge-commercial/server.mjs
          node --check apps/aetherforge-commercial/isolated-runner.mjs
          node --check apps/aetherforge-commercial/engineering-ide.js
          node --test tests/aetherforge-commercial-cloud.test.mjs
      - name: Prove real server health and same-origin boundary
        run: |
          set -euo pipefail
          AETHERFORGE_PORT=4546 node apps/aetherforge-commercial/server.mjs > /tmp/aetherforge-commercial.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4546/api/health > /tmp/commercial-health.json 2>/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module -e "import{readFileSync}from'node:fs';let x=JSON.parse(readFileSync('/tmp/commercial-health.json','utf8'));if(x.version!=='1.5.0-cloud'||!x.multiFileExecution||!x.projectPersistence)process.exit(1);console.log('Commercial HTTP: PASS')"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://evil.invalid' http://127.0.0.1:4546/api/health)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.invalid' http://127.0.0.1:4546/api/health)" = 403
      - name: Pull supported Distroless images for bounded smoke probes
        run: |
          docker pull gcr.io/distroless/nodejs22-debian13:nonroot
          docker pull gcr.io/distroless/python3-debian13:nonroot
      - name: Execute actual Node and Python projects through policy
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { runIsolatedProject } from './apps/aetherforge-commercial/isolated-runner.mjs';
          const samples = [
            {language:'node',entry:'index.js',files:{'index.js':"console.log('AETHERFORGE_CLOUD_NODE_OK')"},needle:'AETHERFORGE_CLOUD_NODE_OK'},
            {language:'python',entry:'main.py',files:{'main.py':"print('AETHERFORGE_CLOUD_PYTHON_OK')"},needle:'AETHERFORGE_CLOUD_PYTHON_OK'}
          ];
          for(const {needle,...job} of samples){
            const result=await runIsolatedProject(job);
            assert.equal(result.status,'completed',JSON.stringify(result));
            assert.equal(result.exitCode,0,JSON.stringify(result));
            assert.ok(result.stdout.includes(needle),JSON.stringify(result));
            console.log('PASS '+job.language+' — '+needle);
          }
          NODE
